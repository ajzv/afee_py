<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejemplo: bandera de Paraguay flameando</title>
<link rel="stylesheet" href="fondo-bandera.css">
<style>
 body{margin:0;background:#0F0F0F;color:#F8F8F8;font-family:system-ui,sans-serif}
 .wrap{width:min(1120px,100% - 2rem);margin-inline:auto;text-align:center}
 .hero{padding-block:clamp(4rem,12vw,8rem)}
 h1{font:700 clamp(2rem,5vw,3.4rem) Georgia,serif;color:#D4AF37;margin:0 0 1rem}
</style>
</head>
<body>

<!-- 1) Tu sección con el fondo: el bloque .flag va como PRIMER hijo -->
<section class="hero">
  <div class="flag" aria-hidden="true">
    <canvas id="flagcv"></canvas>
    <img id="flagimg" alt="" src="fondo.jpg">
  </div>

  <div class="wrap">
    <h1>UNA VEZ ESPARTANO, SIEMPRE ESPARTANO</h1>
    <p>Aquí va tu contenido normal.</p>
  </div>
</section>

<!-- 2) El script, al final del body -->
<script src="fondo-bandera.js"></script>
</body>
</html>
